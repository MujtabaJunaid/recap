name: Deploy proxy to Heroku

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-proxy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:

concurrency:
  group: heroku-proxy
  cancel-in-progress: false

env:
  HEROKU_APP: recap-action-plan-proxy

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The proxy has no dependencies, so a syntax check plus its own smoke test is the
      # whole gate. A broken deploy here takes the AI path down for every user.
      - run: node --check server/index.js
      - run: node --check server/hash-password.mjs
      - run: node server/smoke-test.mjs

  deploy:
    needs: verify
    # The smoke test runs on every PR touching the proxy; deploying only from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: heroku-proxy
      url: https://recap-action-plan-proxy-a93bd7dd6d10.herokuapp.com
    steps:
      - uses: actions/checkout@v4

      - name: Package the server directory
        run: tar -czf server.tgz -C server .

      - name: Upload source and build
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Accept: application/vnd.heroku+json; version=3" \
                            -H "Authorization: Bearer $HEROKU_API_KEY" "$@"; }

          src=$(api -X POST "https://api.heroku.com/apps/$HEROKU_APP/sources")
          put=$(echo "$src" | jq -r '.source_blob.put_url')
          get=$(echo "$src" | jq -r '.source_blob.get_url')

          curl -sS -X PUT -H "Content-Type:" --data-binary @server.tgz "$put"

          build=$(api -X POST "https://api.heroku.com/apps/$HEROKU_APP/builds" \
            -H "Content-Type: application/json" \
            -d "{\"source_blob\":{\"url\":\"$get\",\"version\":\"${GITHUB_SHA::7}\"}}")
          id=$(echo "$build" | jq -r '.id')
          echo "build $id"

          # Poll rather than fire and forget: a dispatched build that fails is not a
          # deploy, and the job must go red for it.
          for _ in $(seq 1 60); do
            status=$(api "https://api.heroku.com/apps/$HEROKU_APP/builds/$id" | jq -r '.status')
            [ "$status" = "pending" ] || break
            sleep 5
          done
          echo "build status: $status"
          [ "$status" = "succeeded" ]

      - name: Wait for the dyno and verify health
        run: |
          set -euo pipefail
          url="https://recap-action-plan-proxy-a93bd7dd6d10.herokuapp.com/health"
          for _ in $(seq 1 30); do
            body=$(curl -sS --max-time 10 "$url" || true)
            if echo "$body" | jq -e '.ok == true and .keyConfigured == true and .authConfigured == true' >/dev/null 2>&1; then
              echo "healthy: $body"
              exit 0
            fi
            sleep 5
          done
          echo "proxy did not report healthy after deploy"
          echo "last response: ${body:-<none>}"
          exit 1
